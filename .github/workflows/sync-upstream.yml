name: Sync upstream edgetunnel

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mirror
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync from upstream
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/cmliu/edgetunnel.git || true
          git fetch upstream main
          git checkout main
          # This mirror carries its own workflow commits, so history normally
          # diverges from upstream and cannot be updated with --ff-only.
          git merge --no-edit upstream/main
          git push origin main
